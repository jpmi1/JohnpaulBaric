<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JohnPaul Baric</title>
  <meta
    http-equiv="refresh"
    content="0; url=https://www.linkedin.com/in/jp-baric-6372a764/"
  />
  <link rel="canonical" href="https://www.linkedin.com/in/jp-baric-6372a764/" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080c;
      --panel: rgba(8, 20, 28, 0.9);
      --border: rgba(0, 220, 250, 0.28);
      --text: #e8fbff;
      --muted: #8ba7b5;
      --accent: #00dcfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(0, 220, 250, 0.18), transparent 38%),
        linear-gradient(180deg, #030608 0%, var(--bg) 100%);
      color: var(--text);
      font:
        500 16px/1.6 "General Sans", "Avenir Next", "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 32px 120px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font:
        700 clamp(2rem, 5vw, 3.5rem)/0.95 "Clash Display", "Avenir Next", sans-serif;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
  <script>
    window.location.replace("https://www.linkedin.com/in/jp-baric-6372a764/");
  </script>
</head>
<body>
  <main>
    <h1>Redirecting to LinkedIn</h1>
    <p>
      If you are not redirected automatically,
      <a href="https://www.linkedin.com/in/jp-baric-6372a764/">open JohnPaul Baric on LinkedIn</a>.
    </p>
  </main>
</body>
</html>
